---
# monitoring/monitoring-setup.yaml
#
# PURPOSE: Deploy Prometheus + Grafana on the K8s cluster using Helm.
#          Grafana is exposed as a NodePort (32000) on every cluster node.
#
# RUN AFTER k8s/k8s-setup.yaml
#
# USAGE:
#   ansible-playbook -i inventory.ini monitoring/monitoring-setup.yaml
#
# TAGS (selective execution):
#   metrics_server — install Metrics Server (kubectl top, HPA)
#   prometheus     — add Helm repo, install kube-prometheus-stack
#   grafana        — apply Grafana NodePort service
#   loki           — install Loki + Promtail (log aggregation)

- name: Deploy monitoring stack to K8s
  hosts: control_plane
  become: yes

  tasks:
    # ── Metrics Server ────────────────────────────────────────────────────────
    # Enables kubectl top and Horizontal Pod Autoscaler.
    - name: Install Metrics Server
      become: no
      command: kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
      run_once: yes
      tags: [metrics_server]

    - name: Patch Metrics Server — add --kubelet-insecure-tls flag
      become: no
      command: >-
        kubectl patch deployment metrics-server -n kube-system --type=json
        -p='[{"op": "add", "path": "/spec/template/spec/containers/0/args/-", "value": "--kubelet-insecure-tls"}]'
      register: patch_result
      changed_when: "'patched' in patch_result.stdout"
      tags: [metrics_server]

    - name: Restart Metrics Server after patch
      become: no
      command: kubectl rollout restart deployment metrics-server -n kube-system
      when: patch_result.changed
      tags: [metrics_server]

    # ── Prometheus + Grafana ──────────────────────────────────────────────────
    - name: Add Prometheus community Helm repository
      become: no
      command: helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
      tags: [prometheus]

    - name: Update Helm repositories
      become: no
      command: helm repo update
      tags: [prometheus]

    - name: Install kube-prometheus-stack via Helm
      become: no
      command: >-
        helm upgrade --install prometheus-stack
        prometheus-community/kube-prometheus-stack
        --namespace monitoring --create-namespace
      tags: [prometheus]

    - name: Copy Grafana NodePort service manifest
      copy:
        src: files/grafana-service.yaml
        dest: /tmp/grafana-service.yaml
        mode: '0644'
      tags: [grafana]

    - name: Apply Grafana NodePort service
      become: no
      command: kubectl apply -f /tmp/grafana-service.yaml
      tags: [grafana]

    - name: Show Grafana access URL
      debug:
        msg: "Grafana: http://{{ ansible_host }}:32000  (default login: admin / prom-operator)"
      tags: [grafana]

    # ── Loki + Promtail ───────────────────────────────────────────────────────
    # Loki stores logs; Promtail runs on every node and ships logs to Loki.
    # In Grafana, add a Loki datasource pointing to http://loki-stack:3100
    - name: Add Grafana Helm repository (for Loki)
      become: no
      command: helm repo add grafana https://grafana.github.io/helm-charts
      tags: [loki]

    - name: Update Helm repositories
      become: no
      command: helm repo update
      tags: [loki]

    - name: Install Loki stack (Loki + Promtail)
      become: no
      command: >-
        helm upgrade --install loki-stack grafana/loki-stack
        --namespace monitoring --create-namespace
        --set grafana.enabled=false
        --set prometheus.enabled=false
      tags: [loki]

    - name: Wait for Loki to become ready
      become: no
      command: kubectl rollout status statefulset/loki-stack -n monitoring --timeout=120s
      changed_when: false
      tags: [loki]

    - name: Show Loki datasource URL for Grafana
      debug:
        msg: "Add Loki datasource in Grafana: http://loki-stack:3100"
      tags: [loki]
