[crio]
# Path to the "root directory". CRI-O stores all of its data, including
# containers images, in this directory.
root="/var/lib/containers/storage" 

# Path to the "run directory". CRI-O stores all of its state in this directory.
runroot="/var/run/containers/storage" 

# Storage driver used to manage the storage of images and containers. Please 
# refer to containers-storage.conf(5) to see all available storage drivers.
#storage_driver="overlay" 

# List to pass options to the storage driver. Please refer to 
# containers-storage.conf(5) to see all available storage options.
#storage_option=[] 

# The default log directory where all logs will go unless directly specified 
# by the kubelet. The log directory specified must be an absolute directory.
log_dir="/var/log/crio/pods" 

# Location for CRI-O to lay down the temporary version file. It is used to 
# check if crio wipe should wipe containers, which should always happen 
# on a node reboot
version_file="/var/run/crio/version" 

# Location for CRI-O to lay down the persistent version file. It is used to 
# check if crio wipe should wipe images, which should only happen when 
# CRI-O has been upgraded
#version_file_persist=""

# Store newly pulled images in the specified path, rather than the path 
# provided by --root.
#imagestore="" 

# This option is currently DEPRECATED, and will be removed in the future. 
# Whether CRI-O should wipe containers after a reboot and images after 
# an upgrade when the server starts. If set to false, one must run 
# "crio wipe" to wipe the containers and images in these situations
#internal_wipe=true

# InternalRepair is whether CRI-O should check if the container and image 
# storage was corrupted after a sudden restart. If it was, CRI-O also attempts 
# to repair the storage.
#internal_repair=true 

# Location for CRI-O to lay down the clean shutdown file. It is used to check 
# whether crio had time to sync before shutting down. If not found, 
# crio wipe will clear the storage directory.
#clean_shutdown_file="/var/lib/crio/clean.shutdown" 

[crio.api]
# Path to AF_LOCAL socket on which CRI-O will listen.
#listen="/var/run/crio/crio.sock" 

# IP address on which the stream server will listen.
#stream_address="127.0.0.1" 

# The port on which the stream server will listen. If the port is set to "0", 
# then CRI-O will allocate a random free port number.
#stream_port="0" 

# Enable encrypted TLS transport of the stream server.
#stream_enable_tls=false 

# Length of time until open streams terminate due to lack of activity.
#stream_idle_timeout="" 

# Path to the x509 certificate file used to serve the encrypted stream. 
# This file can change and CRI-O will automatically pick up the changes 
# within 5 minutes.
#stream_tls_cert="" 

# Path to the key file used to serve the encrypted stream. This file can 
# change and CRI-O will automatically pick up the changes within 5 minutes.
#stream_tls_key="" 

# Path to the x509 CA(s) file used to verify and authenticate client 
# communication with the encrypted stream. This file can change and CRI-O 
# will automatically pick up the changes within 5 minutes.
#stream_tls_ca="" 

# Maximum grpc send message size in bytes. If not set or <=0, 
# then CRI-O will default to 80 _ 1024 _ 1024.
#grpc_max_send_msg_size=83886080 

# Maximum grpc receive message size. If not set or <= 0, 
# then CRI-O will default to 80 _ 1024 _ 1024.
#grpc_max_recv_msg_size=83886080 

[crio.runtime]
# The name of the OCI runtime to be used as the default. 
# This option supports live configuration reload.
#default_runtime="crun"

# A list of ulimits to be set in containers by default, specified as "=:",
# for example:"nofile=1024:2048". If nothing is set here, settings will be 
# inherited from the CRI-O daemon.
#default_ulimits=[] 

# If true, the runtime will not use pivot_root, but instead use MS_MOVE. 
#no_pivot=false

# Path where the keys required for image decryption are located 
#decryption_keys_path="/etc/crio/keys/"

# Path to the conmon binary, used for monitoring the OCI runtime. 
# Will be searched for using $PATH if empty. 
# This option is currently deprecated, and will be replaced with RuntimeHandler.MonitorPath.
#conmon=""

# Cgroup setting for conmon 
# This option is currently deprecated, and will be replaced with RuntimeHandler.MonitorCgroup. 
#conmon_cgroup=""

# Environment variable list for the conmon process, used for passing necessary 
# environment variables to conmon or the runtime. 
# This option is currently deprecated, and will be replaced with RuntimeHandler.MonitorEnv. 
#conmon_env=[]

# Additional environment variables to set for all the containers. 
# These are overridden if set in the container image spec or in the container runtime configuration.
#default_env=[]

# If true, SELinux will be used for pod separation on the host. 
# This option is deprecated, and be interpreted from whether SELinux is enabled on the host in the future.
#selinux=false

# Path to the seccomp.json profile which is used as the default seccomp profile 
# for the runtime. If not specified, then the internal default seccomp profile 
# will be used. 
# This option is currently deprecated, and will be replaced by the SeccompDefault FeatureGate in Kubernetes.
#seccomp_profile=""

# Used to change the name of the default AppArmor profile of CRI-O. 
# The default profile name is "crio-default".
#apparmor_profile=""

# Path to the blockio class configuration file for configuring the cgroup blockio controller.
#blockio_config_file=""

# If true, the runtime reloads blockio_config_file and rescans block devices 
# in the system before applying blockio parameters.
#blockio_reload=false

# Directories to scan for Container Device Interface Specifications to enable 
# CDI device injection. For more details about CDI and the syntax of CDI Spec 
# files please refer to https://github.com/container-orchestrated-devices/container-device-interface.
# 
# Directories later in the list have precedence over earlier ones. The default directory list is:\
# 
# cdi_spec_dirs = [
#	  "/etc/cdi",
#	  "/var/run/cdi",
# 
# ]
#cdi_spec_dirs=[]

# Used to change irqbalance service config file which is used by CRI-O. 
# For CentOS/SUSE, this file is located at /etc/sysconfig/irqbalance. 
# For Ubuntu, this file is located at /etc/default/irqbalance.
#irqbalance_config_file="/etc/sysconfig/irqbalance" 

# Used to set the irqbalance banned cpu mask to restore at CRI-O startup. 
# If set to 'disable', no restoration attempt will be done.
#irqbalance_config_restore_file="/etc/sysconfig/orig_irq_banned_cpus" 

# Path to the RDT configuration file for configuring the resctrl pseudo-filesystem.
#rdt_config_file="" 

# Cgroup management implementation used for the runtime.
cgroup_manager="systemd" 

# List of default capabilities for containers. If it is empty or commented out, 
# only the capabilities defined in the container json file by the user/kube will be added.
# 
# The default list is:
#  default_capabilities = [
#	  "CHOWN",
#	  "DAC_OVERRIDE",
#	  "FSETID",
#	  "FOWNER",
#	  "SETGID",
#	  "SETUID",
#	  "SETPCAP",
#	  "NET_BIND_SERVICE",
#	  "KILL",
#  ]
#default_capabilities=[]

# Add capabilities to the inheritable set, as well as the default group of 
# permitted, bounding and effective. If capabilities are expected to work 
# for non-root users, this option should be set.
#add_inheritable_capabilities=false 

# List of default sysctls. If it is empty or commented out, only the sysctls 
# defined in the container json file by the user/kube will be added.
# One example would be allowing ping inside of containers. 
# On systems that support /proc/sys/net/ipv4/ping_group_range, the default list could be:
# 
# default_sysctls = [
#       "net.ipv4.ping_group_range = 0   2147483647",
#  ]
#default_sysctls=[] 

# List of devices on the host that a user can specify with the "io.kubernetes.cri-o.Devices" allowed annotation.
#allowed_devices=[] 

# List of additional devices. Specified as "::", 
# for example: "--additional-devices=/dev/sdc:/dev/xvdc:rwm". 
# If it is empty or commented out, only the devices defined in the container 
# json file by the user/kube will be added.
#additional_devices=[] 

# Each *.json file in the path configures a hook for CRI-O containers. 
# For more details on the syntax of the JSON files and the semantics of hook 
# injection, see oci-hooks(5). CRI-O currently support both the 1.0.0 
# and 0.1.0 hook schemas, although the 0.1.0 schema is deprecated.
#
# Paths listed later in the array have higher precedence (oci-hooks(5) discusses 
# directory precedence).
#
# For the annotation conditions, CRI-O uses the Kubernetes annotations, which 
# are a subset of the annotations passed to the OCI runtime. For example, 
# io.kubernetes.cri-o.Volumes is part of the OCI runtime configuration 
# annotations, but it is not part of the Kubernetes annotations being matched 
# for hooks.
# 
# For the bind-mount conditions, only mounts explicitly requested by Kubernetes 
# configuration are considered. Bind mounts that CRI-O inserts by 
# default (e.g. /dev/shm) are not considered.
#hooks_dir=["path", ...] 

# List of default mounts for each container. 
# Deprecated: this option will be removed in future versions in favor of default_mounts_file.
#default_mounts=[] 

# Path to the file specifying the defaults mounts for each container. The format 
# of the config is /SRC:/DST, one mount per line. Notice that CRI-O reads its 
# default mounts from the following two files:
# 1) `/etc/containers/mounts.conf` (i.e., default_mounts_file): This is the 
# 	override file, where users can either add in their own default mounts, 
# 	or override the default mounts shipped with the package.
# 2) `/usr/share/containers/mounts.conf`: This is the default file read for 
# 	mounts. If you want CRI-O to read from a different, specific mounts 
# 	file, you can change the default_mounts_file. Note, if this is done, 
# 	CRI-O will only add mounts it finds in this file.
#default_mounts_file=""

# Maximum number of processes allowed in a container. 
# This option is deprecated. 
# The Kubelet flag --pod-pids-limit should be used instead.
#pids_limit=-1 

# Filter the log messages by the provided regular expression. 
# This option supports live configuration reload. For example 'request:.*' filters all gRPC requests.
#log_filter="" 

# Changes the verbosity of the logs based on the level it is set to. 
# Options are fatal, panic, error, warn, info, debug, and trace. 
# This option supports live configuration reload.
log_level="info" 

# Maximum size allowed for the container log file. 
# Negative numbers indicate that no size limit is imposed. 
# If it is positive, it must be >= 8192 to match/exceed conmon's read buffer. 
# The file is truncated and re-opened so the limit is never exceeded. 
# This option is deprecated. The Kubelet flag --container-log-max-size should be used instead.
log_size_max=1048576

# Whether container output should be logged to journald in addition to the kubernetes log file.
#log_to_journald=false 

# Path to directory in which container exit files are written to by conmon.
#container_exits_dir="/var/run/crio/exits" 

# Path to directory for container attach sockets.
#container_attach_socket_dir="/var/run/crio" 

# A prefix to use for the source of the bind mounts. 
# This option would be useful when running CRI-O in a container and 
# the / directory on the host is mounted as /host in the container. 
# Then if CRI-O runs with the --bind-mount-prefix=/host option, CRI-O would add 
# the /host directory to any bind mounts it hands over to CRI. If Kubernetes 
# asked to have /var/lib/foobar bind mounted into the container, then CRI-O 
# would bind mount /host/var/lib/foobar. Since CRI-O itself is running in a 
# container with / or the host mounted on /host, the container would end up 
# with /var/lib/foobar from the host mounted in the container rather than 
# /var/lib/foobar from the CRI-O container.
#bind_mount_prefix="" 

# If set to true, all containers will run in read-only mode.
#read_only=false 

# The UID mappings for the user namespace of each container. A range is specified 
# in the form containerUID:HostUID:Size. Multiple ranges must be separated by comma. 
# This option is deprecated, and will be replaced with native Kubernetes user namespace support in the future.
#uid_mappings="" 

# The lowest host UID which can be specified in mappings supplied, either as 
# part of a uid_mappings or as part of a request received over CRI, for a pod 
# that will be run as a UID other than 0. 
# This option is deprecated, and will be replaced with Kubernetes user namespace support (KEP-127) in the future.
#minimum_mappable_uid=-1

# The GID mappings for the user namespace of each container. A range is 
# specified in the form containerGID:HostGID:Size. Multiple ranges must 
# be separated by comma. 
# This option is deprecated, and will be replaced with Kubernetes user namespace support (KEP-127) in the future.
#gid_mappings=""

# The lowest host GID which can be specified in mappings supplied, either 
# as part of a gid_mappings or as part of a request received over CRI, for a 
# pod that will be run as a UID other than 0. 
# This option is deprecated, and will be replaced with Kubernetes user namespace support (KEP-127) in the future.
#minimum_mappable_gid=-1

# The minimal amount of time in seconds to wait before issuing a timeout 
# regarding the proper termination of the container.
#ctr_stop_timeout=30

# Determines whether we drop the infra container when a pod does not have a 
# private PID namespace, and does not use a kernel separating runtime 
# (like kata). 
# Requires manage_ns_lifecycle to be true.
#drop_infra_ctr=true

# Determines the CPU set to run infra containers. If not specified, the CRI-O 
# will use all online CPUs to run infra containers. You can specify CPUs in 
# the Linux CPU list format. To get better isolation for guaranteed pods, set 
# this parameter to be equal to kubelet reserved-cpus.
#infra_ctr_cpuset=""

# Determines the CPU set which is allowed to be shared between guaranteed 
# containers, regardless of, and in addition to, the exclusiveness of their 
# CPUs. This field is optional and would not be used if not specified. 
# You can specify CPUs in the Linux CPU list format.
#shared_cpuset=""

# The directory where the state of the managed namespaces gets tracked. 
# Only used when manage_ns_lifecycle is true
#namespaces_dir="/var/run"

# The path to find the pinns binary, which is needed to manage namespace lifecycle
#pinns_path=""

# A list of paths that, when absent from the host, will cause a container 
# creation to fail (as opposed to the current behavior of creating a directory).
#absent_mount_sources_to_reject=[]

# Changes the default behavior of setting container devices uid/gid from CRI's 
# SecurityContext (RunAsUser/RunAsGroup) instead of taking host's uid/gid.
#device_ownership_from_security_context=false

# Enable CRIU integration, requires that the criu binary is available in $PATH. 
# (default: true) 
#enable_criu_support=true

# Enable CRI-O to generate the container pod-level events in order to optimize 
# the performance of the Pod Lifecycle Event Generator (PLEG) module in Kubelet.
#enable_pod_events=false

# Determines whether SELinux should be disabled within a pod when it is running 
# in the host network namespace. 
#hostnetwork_disable_selinux=true

# Enable/Disable the container hostport mapping in CRI-O. 
# Default value is set to 'false'.
#disable_hostport_mapping=false

# To set the timezone for a container in CRI-O. If an empty string is provided, 
# CRI-O retains its default behavior. 
# Use 'Local' to match the timezone of the host machine. 
timezone="Local"

[crio.runtime.runtimes]
# Path to the OCI compatible runtime used for this runtime handler.
#runtime_path="" 

# Root directory used to store runtime data
#runtime_root="" 

# Type of the runtime used for this runtime handler. "oci", "vm"
#runtime_type="oci" 

# Override the runtime path, runtime config path, runtime root and runtime type from the default runtime on load.
#inherit_default_runtime=false 

# Path to the runtime configuration file, should only be used with VM runtime types
#runtime_config_path="" 

# Whether this runtime handler prevents host devices from being passed to privileged containers.
#privileged_without_host_devices=false 

# This field is currently DEPRECATED. 
# If you'd like to use allowed_annotations, please use a workload. 
# A list of experimental annotations this runtime handler is allowed to process. 
# The currently recognized values are: 
# "io.kubernetes.cri-o.userns-mode" for configuring a user namespace for the pod. 
# "io.kubernetes.cri-o.Devices" for configuring devices for the pod. 
# "io.kubernetes.cri-o.ShmSize" for configuring the size of /dev/shm. 
# "io.kubernetes.cri-o.UnifiedCgroup.$CTR_NAME" for configuring the cgroup v2 unified block for a container. 
# "io.containers.trace-syscall" for tracing syscalls via the OCI seccomp BPF hook. 
# "seccomp-profile.kubernetes.cri-o.io" for setting the seccomp profile for: 
# 	- a specific container by using: 
# 	"seccomp-profile.kubernetes.cri-o.io/<CONTAINER_NAME>" 
# 	- a whole pod by using: 
# 	"seccomp-profile.kubernetes.cri-o.io/POD" 
# Note that the annotation works on containers as well as on images. 
# For images, the plain annotation seccomp-profile.kubernetes.cri-o.io can 
# be used without the required /POD suffix or a container name.
#allowed_annotations=[]

# The minimum memory that must be set for a container. 
# This value can be used to override the currently set global value for a specific runtime. 
# If not set, a global default value of "12 MiB" will be used.
#container_min_memory="" 

# A mapping of platforms to the corresponding runtime executable paths for the runtime handler.
#platform_runtime_paths={}

# If set to true, the runtime will not sync the log file on rotate or container exit. 
# This option is only valid for the 'oci' runtime type. Setting this option to 
# true can cause data loss, e.g. when a machine crash happens.
#no_sync_log=false 

# A mapping of keys to values of annotations set on containers run by this runtime 
# handler, if not overridden by the pod spec.
#default_annotations={} 

[crio.runtime.workloads]
# The activation_annotation is the pod annotation that activates these workload settings.
#activation_annotation="" 

# The annotation_prefix is the way a pod can override a specific resource for a container. 
# The full annotation must be of the form $annotation_prefix.$resource/$ctrname = $value.
#annotation_prefix="" 

# The allowed_annotations is a slice of experimental annotations that this workload 
# is allowed to process. 
# The currently recognized values are: 
# "io.kubernetes.cri-o.userns-mode" for configuring a user namespace for the pod. 
# "io.kubernetes.cri-o.cgroup2-mount-hierarchy-rw" for mounting cgroups writably when set to "true". 
# "io.kubernetes.cri-o.Devices" for configuring devices for the pod. 
# "io.kubernetes.cri-o.ShmSize" for configuring the size of /dev/shm. 
# "io.kubernetes.cri-o.UnifiedCgroup.$CTR_NAME" for configuring the cgroup v2 unified block for a container. 
# "io.containers.trace-syscall" for tracing syscalls via the OCI seccomp BPF hook. 
# "io.kubernetes.cri-o.seccompNotifierAction" for enabling the seccomp notifier feature. 
# "io.kubernetes.cri-o.umask" for setting the umask for container init process. 
# "io.kubernetes.cri.rdt-class" for setting the RDT class of a container 
# "seccomp-profile.kubernetes.cri-o.io" for setting the seccomp profile for: 
# 	- a specific container by using: 
# 	"seccomp-profile.kubernetes.cri-o.io/<CONTAINER_NAME>" 
# 	- a whole pod by using: 
# 	"seccomp-profile.kubernetes.cri-o.io/POD" 
# Note that the annotation works on containers as well as on images. 
# "io.kubernetes.cri-o.DisableFIPS" for disabling FIPS mode for a pod within a FIPS-enabled Kubernetes cluster.
#allowed_annotations=[] 

[crio.runtime.workload.resources]
# Specifies the number of CPU shares this pod has access to.
#cpushares="" 

# Specifies the cpuset this pod has access to.
#cpuset="" 

[crio.image]
# Default transport for pulling images from a remote container storage.
#default_transport="docker://" 

# The path to a file like /var/lib/kubelet/config.json holding credentials 
# necessary for pulling images from secure registries.
#global_auth_file=""

# The on-registry image used to instantiate infra containers. 
# The value should start with a registry host name. This option supports live configuration reload.
pause_image="registry.k8s.io/pause:3.10" 

# The path to a file like /var/lib/kubelet/config.json holding credentials 
# specific to pulling the pause_image from above. This option supports live configuration reload.
#pause_image_auth_file="" 

# The command to run to have a container stay in the paused state. 
# This option supports live configuration reload.
#pause_command="/pause" 

# A list of images to be excluded from the kubelet's garbage collection. 
# It allows specifying image names using either exact, glob, or keyword patterns. 
# Exact matches must match the entire name, glob matches can have a 
# wildcard * at the end, and keyword matches can have wildcards on both ends. 
# By default, this list includes the pause image if configured by the user, 
# which is used as a placeholder in Kubernetes pods.
#pinned_images=[] 

# Path to the file which decides what sort of policy we use when deciding 
# whether or not to trust an image that we've pulled. It is not recommended 
# that this option be used, as the default behavior of using the system-wide 
# default policy (i.e., /etc/containers/policy.json) is most often preferred. 
# Please refer to containers-policy.json(5) for more details.
#signature_policy=""

# Root path for pod namespace-separated signature policies. The final policy 
# to be used on image pull will be <SIGNATURE_POLICY_DIR>/<NAMESPACE>.json. 
# If no pod namespace is being provided on image pull (via the sandbox config), 
# or the concatenated path is non existent, then the signature_policy or system 
# wide policy will be used as fallback. Must be an absolute path.
#signature_policy_dir="/etc/crio/policies"

# Controls how image volumes are handled. The valid values are mkdir, bind and 
# ignore; the latter will ignore volumes entirely.
#image_volumes="mkdir" 

# List of registries to skip TLS verification for pulling images.
#insecure_registries=[] 

# Path to the temporary directory to use for storing big files, used to store 
# image blobs and data streams related to containers image management.
#big_files_temporary_dir="" 

# [EXPERIMENTAL] If its value is set, then images are pulled into the specified 
# cgroup. If its value is set to "pod", then the pod's cgroup is used. It is 
# currently supported only with the systemd cgroup manager.
#separate_pull_cgroup="" 

# If true, CRI-O will automatically reload the mirror registry when there is an 
# update to the 'registries.conf.d' directory. Default value is set to 'false'.
#auto_reload_registries=false 

# The timeout for an image pull to make progress until the pull operation gets 
# canceled. This value will be also used for calculating the pull progress 
# interval to pull_progress_timeout / 10. Can be set to 0 to disable the timeout 
# as well as the progress output.
#pull_progress_timeout="10s" 

[crio.network]
# The default CNI network name to be selected. If not set or "", then CRI-O will 
# pick-up the first one found in network_dir.
#cni_default_network="" 

# Path to the directory where CNI configuration files are located.
network_dir="/etc/cni/net.d/" 

# List of paths to directories where CNI plugin binaries are located.
plugin_dirs=["/opt/cni/bin/",] 

[crio.metrics]
# Globally enable or disable metrics support.
#enable_metrics=false 

# Specify enabled metrics collectors. Per default all metrics are enabled.
#metrics_collectors=["image_pulls_layer_size", "containers_events_dropped_total", "containers_oom_total", "processes_defunct", "operations_total", "operations_latency_seconds", "operations_latency_seconds_total", "operations_errors_total", "image_pulls_bytes_total", "image_pulls_skipped_bytes_total", "image_pulls_failure_total", "image_pulls_success_total", "image_layer_reuse_total", "containers_oom_count_total", "containers_seccomp_notifier_count_total", "resources_stalled_at_stage"] 

# The IP address or hostname on which the metrics server will listen.
#metrics_host="127.0.0.1" 

# The port on which the metrics server will listen.
#metrics_port=9090 

# The socket on which the metrics server will listen.
#metrics_socket="" 

# The certificate for the secure metrics server.
#metrics_cert="" 

# The certificate key for the secure metrics server.
#metrics_key="" 

[crio.tracing]
# Globally enable or disable OpenTelemetry trace data exporting.
#enable_tracing=false 

# Address on which the gRPC trace collector will listen.
#tracing_endpoint="127.0.0.1:4317" 

# Number of samples to collect per million OpenTelemetry spans. Set to 1000000 to always sample.
#tracing_sampling_rate_per_million="" 

[crio.stats]
# The number of seconds between collecting pod and container stats. If set to 0, the stats are collected on-demand instead. DEPRECATED: This option will be removed in the future. Please use collection_period instead.
#stats_collection_period=0 

# The number of seconds between collecting pod/container stats and pod sandbox metrics. If set to 0, the metrics/stats are collected on-demand instead.
#collection_period=0 

# A list of pod metrics to include. Specify the names of the metrics to include in this list.
#included_pod_metrics=[] 

[crio.nri]
# Directory to scan for pre-installed plugins to automatically start.
#nri_plugin_dir="/opt/nri/plugins" 

# Directory to scan for configuration of pre-installed plugins.
#nri_plugin_config_dir="/etc/nri/conf.d" 

# Socket to listen on for externally started NRI plugins to connect to.
#nri_listen="/var/run/nri/nri.sock" 

# Disable connections from externally started NRI plugins.
#nri_disable_connections=false 

# Timeout for a plugin to register itself with NRI.
#nri_plugin_registration_timeout="5s" 

# Timeout for a plugin to handle an NRI request.
#nri_plugin_request_timeout="2s" 

