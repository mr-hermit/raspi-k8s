# addons/logging/files/grafana-loki-datasource.yaml
#
# Picked up automatically by the Grafana sidecar deployed with kube-prometheus-stack
# (addons/monitoring) — it watches ConfigMaps labeled grafana_datasource=1 in the
# monitoring namespace and provisions them without a Grafana restart.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-loki-datasource
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  loki-datasource.yaml: |-
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki-gateway.monitoring.svc.cluster.local
        isDefault: false
        editable: true
