---
# addons/registry/registry-setup.yaml
#
# PURPOSE: Deploy a private Docker-compatible registry on the K8s cluster and
#          configure all nodes to pull from it without TLS.
#
#          A short-name prefix "raspi" is registered so pods can reference
#          images as raspi/myimage:tag instead of <ip>:<port>/myimage:tag.
#
# RUN AFTER k8s/k8s-setup.yaml
#
# USAGE:
#   ansible-playbook -i inventory.ini addons/registry/registry-setup.yaml
#
# TAGS:
#   registry_config  — add insecure-registry + prefix alias to CRI-O on every node
#   registry_deploy  — deploy registry Deployment + Service to K8s

# ── Play 1: trust the registry on every node ─────────────────────────────────
- name: Configure CRI-O to trust private registry
  hosts: raspservers
  become: yes
  vars:
    # Derived at runtime — control-plane node address where NodePort is exposed
    registry_host: "{{ hostvars[groups['control_plane'][0]]['ansible_host'] }}"
    # registry_nodeport comes from inventory.ini

  tasks:
    - name: Create CRI-O registry drop-in directory
      file:
        path: /etc/containers/registries.conf.d
        state: directory
        mode: "0755"
      tags: [registry_config]

    - name: Configure private registry — insecure trust and short-name prefix
      copy:
        dest: /etc/containers/registries.conf.d/local-registry.conf
        content: |
          # Trust the registry over plain HTTP
          [[registry]]
          location = "{{ registry_host }}:{{ registry_nodeport }}"
          insecure = true

          # Short-name alias: raspi/image → {{ registry_host }}:{{ registry_nodeport }}/image
          [[registry]]
          prefix = "raspi"
          location = "{{ registry_host }}:{{ registry_nodeport }}"
          insecure = true
        mode: "0644"
      notify: Restart CRI-O
      tags: [registry_config]

  handlers:
    - name: Restart CRI-O
      service:
        name: crio
        state: restarted


# ── Play 2: deploy registry to K8s ───────────────────────────────────────────
- name: Deploy private container registry to K8s
  hosts: control_plane
  become: yes
  vars:
    registry_namespace: registry          # K8s namespace — internal to the playbook
    manifest_dest: /tmp/registry-manifest.yaml
    # registry_nodeport, registry_storage_path, registry_storage_size come from inventory.ini

  tasks:
    - name: Create registry storage directory on iSCSI volume
      file:
        path: "{{ registry_storage_path }}"
        state: directory
        mode: "0755"
      tags: [registry_deploy]

    - name: Render and copy registry manifest
      template:
        src: files/registry.yaml.j2
        dest: "{{ manifest_dest }}"
        mode: "0644"
      tags: [registry_deploy]

    - name: Apply registry manifest
      become: no
      shell: kubectl apply -f {{ manifest_dest }}
      changed_when: true
      tags: [registry_deploy]

    - name: Wait for registry pod to become ready
      become: no
      shell: kubectl rollout status deployment/registry -n {{ registry_namespace }} --timeout=120s
      changed_when: false
      tags: [registry_deploy]

    - name: Show registry address
      debug:
        msg: >-
          Registry available at {{ ansible_host }}:{{ registry_nodeport }}
          — use image: raspi/myimage:tag in pod specs
      tags: [registry_deploy]
