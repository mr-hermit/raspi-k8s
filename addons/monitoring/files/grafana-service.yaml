apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: monitoring
spec:
  type: NodePort
  ports:
    - port: 3000       # Grafana's internal port
      targetPort: 3000 # Container port Grafana listens on
      nodePort: 32000  # Port exposed on every cluster node
  selector:
    app.kubernetes.io/name: grafana
